slug: photovoltaics
name: Photovoltaics
version: 1.3.0
description: Device-linked photovoltaic architecture, fabrication, performance,
  spectral response, stability, and computational results.
recommended_sections:
- materials and methods
- device fabrication
- device architecture
- photovoltaic characterization
- spectral response
- operational stability
- results and discussion
process_vocabulary:
- chemical-mechanical polishing
- spin coating
- blade coating
- slot-die coating
- thermal evaporation
- sputtering
- chemical vapor deposition
- annealing
- encapsulation
device_types: [solar_cell, photovoltaic_module]
layer_roles: [substrate, transparent_electrode, etl, absorber, htl, electrode, buffer, interconnect, encapsulation]
scientific_contract:
  performance_requires: [device association, illumination_spectrum, irradiance]
  spectral_response_requires: [wavelength]
  stability_retention_requires: [aging_time]
  evidence_requires: [focal_work ownership, value-specific verbatim evidence, page or official source-data cell locator, locator or table identifier]
  safeguards:
  - do not infer active area from current and current density
  - do not merge distinct devices or processing variants
  - do not convert percent-valued properties into fractions
  - preserve reported scan direction and measurement protocol
  - preserve ordered layer roles independently of material identity
  - computational outputs remain CalculationRecords and use computational property identities
  - explicitly labelled reviews retain cited values only as noncanonical audit candidates
properties:
