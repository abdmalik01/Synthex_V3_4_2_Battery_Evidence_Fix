- fatigue testing
- fracture testing
scientific_contract:
- Use only canonical property keys; never use generic hardness.
- Keep Vickers, Rockwell, Brinell, and indentation hardness distinct and never convert between scales.
- Every output condition set must include scientific_type as reported_measurement, reported_derived_metric, model_prediction, simulation_result, or figure_digitized; preserve reported_term when terminology differs.
- Model predictions belong in CalculationRecord outputs; do not silently derive unreported quantities.
- Preserve reported processing state, heat treatment, microstructure, orientation, temperature, strain rate, loading mode, stress amplitude, stress ratio, frequency, environment, specimen geometry, cycles, and hold time.
- Scalar results remain scalar observations and never imply curve points.
- Curve points require curve_role=curve_point plus series_id and series_origin from source_table, supplementary_data, or figure_digitized.
- Ordinary figure metadata is not numeric evidence; explicitly digitized points must retain figure_digitized provenance.
condition_vocabulary:
- processing_route
- heat_treatment
