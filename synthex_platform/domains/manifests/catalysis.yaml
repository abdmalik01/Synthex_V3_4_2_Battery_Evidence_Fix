slug: catalysis
name: Catalysis & Electrocatalysis
version: 1.1.0-stage1
description: >-
  Stage 1 schema scaffold for heterogeneous catalysis, electrocatalysis, stability,
  characterization and computational catalysis. Canonical admission is not enabled yet.
