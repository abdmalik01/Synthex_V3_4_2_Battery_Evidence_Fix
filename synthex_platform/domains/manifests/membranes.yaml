slug: membranes
name: Membranes
version: 1.2.0
description: Condition- and specimen-linked membrane fabrication, architecture, transport,
  separation, filtration, fouling and stability data.
recommended_sections:
- membrane fabrication
- membrane architecture
- gas permeation
- liquid filtration
- pervaporation
- fouling and cleaning
process_vocabulary:
- phase inversion
- nonsolvent induced phase separation
- interfacial polymerization
- solution casting
- spin coating
- dip coating
- kiss coating
- electrospinning
- sol-gel
- chemical vapor deposition
- crosslinking
- annealing
- drying
properties:
- key: gas_permeability
  name: Gas permeability
  kind: transport
  units: [Barrer, mol*m/(m^2*s*Pa)]
  conditions: [species, test_mode, temperature, pressure_kind]
  aliases: [permeability coefficient]
- key: gas_permeance
  name: Gas permeance
  kind: transport
  units: [GPU, mol/(m^2*s*Pa), 10^2 m_STP^3 m^-2 h^-1 bar^-1]
  conditions: [species, test_mode, temperature, pressure_kind]
  aliases: []
- key: ideal_selectivity
  name: Ideal pure-gas selectivity
  kind: performance
  units: [dimensionless]
  conditions: [species_pair, test_mode, temperature]
  aliases: [ideal separation factor, permselectivity coefficient]
- key: mixed_gas_selectivity
  name: Mixed-gas selectivity
  kind: performance
  units: [dimensionless]
  conditions: [species_pair, test_mode, feed_composition, temperature]
  aliases: []
- key: separation_factor
  name: Pervaporation separation factor
  kind: performance
  units: [dimensionless]
  conditions: [species_pair, feed_composition, temperature]
  aliases: []
- key: liquid_flux
  name: Liquid permeation flux
  kind: transport
  units: [LMH, L/m^2/h, kg/m^2/h, mol/m^2/s]
  conditions: [feed, test_mode, transmembrane_pressure]
  aliases: [water flux, permeation flux]
- key: liquid_permeance
  name: Liquid permeance
  kind: transport
  units: [L/m^2/h/bar, kg/m^2/h/bar]
  conditions: [feed, test_mode, transmembrane_pressure]
  aliases: [water permeance]
- key: solute_rejection
  name: Solute rejection
  kind: performance
  units: ['%', fraction]
  conditions: [solute, feed_concentration, test_mode, transmembrane_pressure]
  aliases: [salt rejection]
- key: retention
  name: Source-reported retention
  kind: performance
  units: ['%', fraction]
  conditions: [solute, feed_concentration, test_mode, transmembrane_pressure]
  aliases: []
- key: initial_flux
  name: Initial clean-water flux
  kind: fouling
  units: [g/m^2/s, kg/m^2/h]
  conditions: [feed, test_mode, transmembrane_pressure]
  aliases: [JWF]
- key: fouled_flux
  name: Flux under foulant feed
  kind: fouling
  units: [g/m^2/s, kg/m^2/h]
  conditions: [feed, foulant, test_mode, transmembrane_pressure]
  aliases: [JHA]
- key: recovered_flux
  name: Post-cleaning recovered flux
  kind: fouling
  units: [g/m^2/s, kg/m^2/h]
  conditions: [feed, foulant, cleaning_method, transmembrane_pressure]
  aliases: [JWF2]
- key: flux_recovery_ratio
  name: Flux recovery ratio
  kind: fouling
  units: ['%']
  conditions: [foulant, cleaning_method]
  aliases: [FRR]
- key: relative_flux_reduction
  name: Relative flux reduction
  kind: fouling
  units: ['%']
  conditions: [foulant]
  aliases: [RFR]
- key: membrane_thickness
  name: Whole membrane thickness
  kind: structure
  units: [um, nm]
  conditions: [thickness_scope]
  aliases: []
- key: selective_layer_thickness
  name: Selective-layer thickness
  kind: structure
  units: [um, nm]
  conditions: [thickness_scope]
  aliases: []
- key: calculated_membrane_permeability_coefficient
  name: Calculated membrane permeability coefficient
  kind: computational_transport
  units: [cm/s]
  conditions: [species, temperature, simulation_method, lipid_composition]
  aliases: [calculated pd,mem]
- key: calculated_apparent_diffusion_coefficient
  name: Calculated apparent diffusion coefficient
  kind: computational_transport
  units: [10^-6 cm^2/s]
  conditions: [species, temperature, simulation_method, lipid_composition]
  aliases: [calculated Dapp]
benchmarks:
- id: membranes.gas_transport
  name: Specimen- and species-linked gas transport
  target: gas_permeability
  group_by: [membrane_specimen, species, test_mode, temperature, pressure]
- id: membranes.liquid_separation
  name: Solute-specific liquid separation
  target: solute_rejection
  group_by: [membrane_specimen, solute, feed_concentration, pressure]
- id: membranes.fouling_recovery
  name: Fouling and cleaning recovery
  target: flux_recovery_ratio
  group_by: [membrane_specimen, foulant, cleaning_method]
graph_relations:
- input_to
