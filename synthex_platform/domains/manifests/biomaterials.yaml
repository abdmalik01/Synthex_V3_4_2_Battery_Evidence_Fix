slug: biomaterials
name: Biomaterials
version: 1.0.0
description: Material composition, fabrication, biological assay conditions, mechanical
  properties and biocompatibility.
scientific_entities:
- material_formulation
- fabrication_process
- scaffold_or_hydrogel_specimen
- biological_system
- assay_experiment
- measured_outcome
- separate_computational_calculation
v1_scope_exclusions:
- drug_delivery_release_kinetics
- figure_only_numeric_interpolation
- inferred_bactericidal_classification
scientific_contract:
- A material formulation, fabrication process, and scaffold or hydrogel specimen are separate entities.
- Link every result to exactly one specimen and its material formulation.
- Retain cell line, assay identity, and exposure time for cell outcomes.
- Retain organism and strain for antimicrobial outcomes; never invent an unreported incubation time.
- Cell viability, proliferation, cytotoxicity, and metabolic activity are distinct endpoints.
- Mass loss, degradation rate, swelling ratio, and water uptake are distinct endpoints.
- Missing table cells are null, not zero; graph-only points are not exact values.
- A computed prediction is a calculation, never an experimental biological assay.
- Preserve FDM printing speed, nozzle and bed temperatures, nozzle diameter, layer height, and infill density as process parameters, not specimen results.
recommended_sections:
- materials
- fabrication
- surface characterization
- cell culture
- biological assays
- mechanical testing
- results
process_vocabulary:
- 3D printing
- electrospinning
- crosslinking
- freeze drying
- surface functionalization
- sterilization
- cell seeding
