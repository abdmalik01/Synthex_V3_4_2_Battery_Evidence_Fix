slug: corrosion
name: Corrosion
version: 1.1.0
description: Source-tracked corrosion materials intelligence covering alloy/substrate identity,
  surface preparation, coatings and inhibitors, corrosive environments, electrochemical and
  immersion tests, EIS, degradation metrics, and bounded computational corrosion results.
recommended_sections:
- materials and methods
- alloy or substrate preparation
- surface preparation
- coating or inhibitor preparation
- corrosion testing
- potentiodynamic polarization
- electrochemical impedance spectroscopy
- immersion or weight-loss testing
- surface characterization
- computational methods
- results and discussion
