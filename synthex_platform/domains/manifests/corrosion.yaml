scientific_guardrails:
- Preserve the reported reference electrode; do not silently convert corrosion or pitting potentials between reference scales.
- A current-density unit does not by itself prove the exposed geometric area or normalization basis.
- Do not calculate corrosion rate from icorr unless an explicitly supported derivation contract is used with all required inputs.
- Keep EIS fitted parameters tied to the reported equivalent circuit and exposure condition; do not relabel them as polarization values.
- Keep review, comparison-table, cited-prior-work and background values out of focal canonical results.
- Keep DFT and molecular-simulation descriptors in calculations, not experimental corrosion measurements.
- Preserve ambiguous or conflicting test conditions instead of silently choosing one.
